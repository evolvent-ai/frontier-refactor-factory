# Probe batch 2 of 3: why does repo refuse everything?
#
# 105 repo candidates since 2026-08-28 produced zero tasks. The refusal reasons say the bottleneck
# is NOT sourcing:
#
#     build/reference-will-not-build      89
#     subject/subject-failed              97
#     specify/could-not-specify           91
#
# "Will not build" means sourcing found the material and the pipeline got hold of it. Changing the
# topic list would not touch that -- and would destroy the comparability of the historical yield
# while appearing to be a fix. What is needed first is the specific build failures: a missing
# toolchain in the image is our fault and repairable, a project whose deps need network is the
# material's and is an honest refusal.
#
# repo/cpp is the one cell where the material verdict is already evidenced (30 candidates, mostly
# libraries with no CLI). Go is the cell with the most attested history, so a failure here is a
# regression signal rather than an unknown.
#
# budget 2 with max_attempts 20: the point is to collect refusal reasons, not to emit. A wide
# attempt count over a small emit budget is what makes the refusal distribution readable.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-repo.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-repo.checkpoint.json
freeze_runs: 5
max_concurrent: 4
e2b_max_active: 8
llm_max_concurrent: 4
llm_calls_per_minute: 60
sandboxed: true
jobs:
  - scale: repo
    form: inplace
    source_language: go
    budget: 2
    max_attempts: 20
