output_dir: tasks/four_scales_test
freeze_runs: 3
max_concurrent: 4
sandboxed: false

# Set GITHUB_TOKEN in the environment; do not commit credentials.

jobs:
  # module — one hot file from a GitHub Python algo repo
  - scale: module
    form: inplace
    source_language: python
    budget: 3

  # kernel — same seam, numeric profile
  - scale: kernel
    form: inplace
    source_language: python
    budget: 3

  # package — whole library from GitHub
  - scale: package
    form: inplace
    source_language: python
    budget: 3

  # repo — whole program from GitHub
  - scale: repo
    form: inplace
    source_language: python
    budget: 3
