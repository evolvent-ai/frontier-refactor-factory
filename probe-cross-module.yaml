# Probe 4: cross-language, which has never emitted a task.
#
# All 136 task.toml on disk carry `target_language = ""` and none says `cross_language = true`.
# DESIGN.md records repo as having proved both the same-language and cross-language forms; the
# artefacts do not support the second half. So this is an untested path being called tested.
#
# python -> javascript on the call seam: the reference is Python, the submission must be
# JavaScript, and the JSON-lines seam is what makes the two comparable without either being
# named in the contract. module/python is the healthiest cell (3/3 this session), so a failure
# here is about the cross form rather than about thin material.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-cross-module.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-cross-module.checkpoint.json
freeze_runs: 5
max_concurrent: 4
e2b_max_active: 8
llm_max_concurrent: 4
sandboxed: true
jobs:
  - scale: module
    form: cross
    source_language: python
    target_language: javascript
    budget: 2
    max_attempts: 10
