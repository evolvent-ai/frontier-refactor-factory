# The remaining repo cells, and a fair retry for repo/python.
#
# repo/python refused 10 of 10 as material: 3 for unpinned dependency constraints and 5 for having
# no discoverable entry point -- sqlglot, m3u8 and rdflib are LIBRARIES, and the process seam needs
# a program it can run. That is the same shape repo/cpp measured. Python does ship real CLI tools,
# so a wider attempt count is what separates "the material is thin" from "we stopped looking too
# early"; 30 attempts buys that answer honestly.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/cells-repo-rest.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/cells-repo-rest.checkpoint.json
freeze_runs: 5
max_concurrent: 3
e2b_max_active: 3
llm_max_concurrent: 3
sandboxed: true
jobs:
  - scale: repo
    form: inplace
    source_language: python
    budget: 1
    max_attempts: 30
  - scale: repo
    form: inplace
    source_language: javascript
    budget: 1
    max_attempts: 15
  - scale: repo
    form: inplace
    source_language: typescript
    budget: 1
    max_attempts: 15
