output_dir: tasks/run_test
freeze_runs: 5
max_concurrent: 8
llm_max_concurrent: 6
llm_calls_per_minute: 60
sandboxed: true

jobs:
  # module — inplace Python (expected ~60-70% yield)
  - scale: module
    form: inplace
    source_language: python
    budget: 15

  # module — cross: python→rust (budget higher, yield lower)
  - scale: module
    form: cross
    source_language: python
    target_language: rust
    budget: 20

  # package — inplace Python
  - scale: package
    form: inplace
    source_language: python
    budget: 15

  # repo — inplace Python
  - scale: repo
    form: inplace
    source_language: python
    budget: 15
