# The cells whose mechanism is already proved and which only lack a batch.
#
#   module/cpp, package/cpp   kernel/cpp emitted this session, so the miner, bridge and shim work
#   package/rust              the static dispatcher exists and was never exercised
#   package/typescript        the tsc/CommonJS fault was fixed and never re-verified
#
# Separate jobs so each keeps its own denominator: a shared attempt pool would let one language
# spend another's budget and make every yield here a mixture.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/cells-ready.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/cells-ready.checkpoint.json
freeze_runs: 5
max_concurrent: 4
e2b_max_active: 4
llm_max_concurrent: 4
sandboxed: true
jobs:
  - scale: module
    form: inplace
    source_language: cpp
    budget: 1
    max_attempts: 8
  - scale: package
    form: inplace
    source_language: cpp
    budget: 1
    max_attempts: 8
  - scale: package
    form: inplace
    source_language: rust
    budget: 1
    max_attempts: 8
  - scale: package
    form: inplace
    source_language: typescript
    budget: 1
    max_attempts: 8
