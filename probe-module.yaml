# Probe batch 3 of 3: is the healthy scale still healthy?
#
# module is the one scale that is genuinely production-ready: 14 emitted against 14 refused, a 50%
# yield, and 179 candidate-seconds per emitted task -- sixty times cheaper than package. It is the
# basis for the claim that 300 module tasks are reachable in a long run.
#
# THAT CLAIM IS ONLY AS GOOD AS ITS LAST MEASUREMENT. A week of changes landed for the static
# languages: the call bridge, the sandbox compile, the miner's export filter, the gateway retry.
# None of them targeted module, which is exactly why this runs -- a regression in the scale nobody
# was editing is the one that would go unnoticed until a 120-hour run had spent itself.
#
# Python because it holds the largest measured supply (2054 repositories across the nine function
# topics) and most of module's attested history, so a drop here is a regression rather than a thin
# corner of the corpus.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-module.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-module.checkpoint.json
freeze_runs: 5
max_concurrent: 4
e2b_max_active: 8
llm_max_concurrent: 4
llm_calls_per_minute: 60
sandboxed: true
jobs:
  - scale: module
    form: inplace
    source_language: python
    budget: 3
    max_attempts: 12
