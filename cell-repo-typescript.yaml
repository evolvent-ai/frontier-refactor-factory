# repo/typescript as its own job. A three-job config gave each job attempted=1 against max_attempts=15:
# waves are capped at `min(remaining_tasks, room)` = 1 when budget is 1, and the next find() call
# re-serves the same first page (sourcing.walk restarts paging at 0), so `unseen` empties and the
# loop breaks far short of its stated limit. A single-job config reached its full attempt count.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/cell-repo-typescript.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/cell-repo-typescript.checkpoint.json
freeze_runs: 5
max_concurrent: 2
e2b_max_active: 2
llm_max_concurrent: 3
sandboxed: true
jobs:
  - scale: repo
    form: inplace
    source_language: typescript
    budget: 1
    max_attempts: 15
