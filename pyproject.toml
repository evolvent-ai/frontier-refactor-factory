[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-refactor-factory"
version = "0.1.0"
description = "Performance-oriented refactoring benchmark tasks, at four codebase scales"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# The factory itself has no third-party runtime dependency, and that is worth keeping. Everything it
# needs -- subprocesses, JSON, hashing, statistics -- is in the standard library, so a task package
# it emits can vendor its verifier without dragging an install behind it.
# Harbor is the exception, and it is not a convenience: `core/harbor.py` does not write task.toml as
# text, it constructs a real `harbor.models.task.config.TaskConfig` and serialises it. The emitted
# format IS whichever harbor is installed, which is the point -- the factory cannot drift from the
# published schema because it never restates it.
#
# BOUNDED ABOVE for that same reason. Unbounded, a harbor release changes the format of every task
# this factory emits, and the change is first noticed partway through a batch rather than at install
# time -- two runs a month apart would emit different formats into one corpus. Widening this is a
# deliberate act: read what moved, run a batch, then raise the ceiling.
dependencies = [
    "harbor>=0.22,<0.23",
]

[project.scripts]
frf = "frf.cli:main"

[project.optional-dependencies]
# Sourcing and drafting reach the network; nothing else does. Kept optional so that reading a task,
# replaying one, or running the test suite needs none of it.
# The grammars are what let the miner read a statically typed checkout at all. Pinned to the
# versions the scanner's tests were written against: a grammar can rename a node between releases,
# and `native_functions._GRAMMARS` keys on those names. A MISSING grammar is silent rather than
# loud -- `_parser` returns None and the scan yields nothing -- so an undeclared one would look
# exactly like a supply with no usable functions in it.
sourcing = [
    "requests>=2.31",
    "tree_sitter>=0.25,<0.27",
    "tree_sitter_go>=0.25,<0.26",
    "tree_sitter_rust>=0.24,<0.25",
    "tree_sitter_java>=0.23,<0.24",
    "tree_sitter_cpp>=0.23,<0.24",
]
sandbox = ["e2b>=1.0"]
dev = ["pytest>=8", "pyflakes>=3"]

[tool.setuptools.packages.find]
include = ["frf*"]

[tool.setuptools.package-data]
# The shims are data, not importable code: they are written into a task and run there, by whichever
# language the subject is in. They have to ship with the wheel.
#
# ONE ENTRY PER TEMPLATE THAT EXISTS, and the list was wrong: it named .py/.go/.js/.rb, so `serve.c`,
# `serve.rs` and `Serve.java` were left out of the wheel. That failure is SILENT and it lies about a
# design claim -- `shims.available()` answers by asking whether the template file exists, so an
# installed wheel reported c, cpp, rust and java as languages this factory cannot serve, while the
# repository reported that it can. A missing template is indistinguishable from an unsupported
# language, which is the confusion the shim table exists to prevent.
"frf.observe.call.shims" = ["*.py", "*.c", "*.go", "*.java", "*.js", "*.rb", "*.rs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
