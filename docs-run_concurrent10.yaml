output_dir: tasks/concurrent10
freeze_runs: 5
max_concurrent: 10
llm_max_concurrent: 8
llm_calls_per_minute: 60
sandboxed: true

jobs:
  # module inplace — Python (main scale, test concurrency)
  - scale: module
    form: inplace
    source_language: python
    budget: 20

  # module cross — python→rust
  - scale: module
    form: cross
    source_language: python
    target_language: rust
    budget: 20

  # package inplace — Python
  - scale: package
    form: inplace
    source_language: python
    budget: 15

  # repo inplace — Python
  - scale: repo
    form: inplace
    source_language: python
    budget: 15
