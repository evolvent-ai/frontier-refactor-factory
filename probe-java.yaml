# Probe 6: java, with the visibility filter that 
# e896480 added.
#
# Java is registered, has a shim, a tree-sitter miner and a generated bridge, and has never
# produced a graded task. The multi-language batch showed why: the miner required `static` and
# stopped there, so `private static` methods were offered to a bridge that compiles as class
# `Subject` and cannot name them -- `getLCA(int,int,int[],int[]) has private access in LCA`.
#
# That batch ran the pre-fix miner. This one runs the fixed one, and it is the only thing that
# turns "should work now" into a fact.
output_dir: /data/evolvent/shijian-workdir/ffr-results/test
ledger_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-java.ledger.jsonl
checkpoint_file: /data/evolvent/shijian-workdir/ffr-results/test/probe-java.checkpoint.json
freeze_runs: 5
max_concurrent: 4
e2b_max_active: 8
llm_max_concurrent: 4
sandboxed: true
jobs:
  - scale: kernel
    form: inplace
    source_language: java
    budget: 1
    max_attempts: 8
